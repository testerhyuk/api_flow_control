spring:
  application:
    name: flow-control

flow-control:
  health:
    window: 10s
    evaluation-interval: 1s
    minimum-calls: 50
    degraded-failure-rate: 0.10
    critical-failure-rate: 0.50
    degraded-latency-multiplier: 2.0
    recovery-duration: 30s
  limit-adjustment:
    degraded-ratio: 0.5
    recovery-step: 0.05
  target-systems:
    target-a:
      url: http://localhost:9001
      connect-timeout: 1s
      read-timeout: 3s
      max-tps: 100
      baseline-rtt: 100ms
      safety-margin: 0.95
      burst-window: 10ms
    target-b:
      url: http://localhost:9002
      connect-timeout: 1s
      read-timeout: 3s
      max-tps: 50
      baseline-rtt: 300ms
      safety-margin: 0.95
      burst-window: 10ms
    target-c:
      url: http://localhost:9003
      connect-timeout: 1s
      read-timeout: 3s
      max-tps: 20
      baseline-rtt: 1s
      safety-margin: 0.95
      burst-window: 10ms