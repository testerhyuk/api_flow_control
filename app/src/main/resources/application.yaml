spring:
  application:
    name: flow-control
  datasource:
    url: jdbc:postgresql://localhost:5432/flow_control
    username: flow_control
    password: flow_control
  data:
    redis:
      host: localhost
      port: 6379
      timeout: ${flow-control.shared-limit.redis-timeout}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flow-control
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus

flow-control:
  health:
    window: 10s
    evaluation-interval: 1s
    minimum-calls: 50
    degraded-failure-rate: 0.10
    critical-failure-rate: 0.50
    degraded-latency-multiplier: 2.0
    recovery-duration: 30s
  limit-adjustment:
    degraded-ratio: 0.5
    recovery-step: 0.05
  policy:
    refresh-interval: 5s
    dry-run-max-duration: 30m
  shared-limit:
    proposal-ttl: 5s
    redis-timeout: 50ms
    recheck-interval: 5s