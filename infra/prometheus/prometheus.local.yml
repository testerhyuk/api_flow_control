# flow-control 과 mock-target-system 을 PC 에서 직접 켤 때 쓰는 설정이다.
# PROMETHEUS_CONFIG=./prometheus/prometheus.local.yml docker compose up -d prometheus
global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flow-control
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
  - job_name: mock-target-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:9101
          - host.docker.internal:9102
          - host.docker.internal:9103
