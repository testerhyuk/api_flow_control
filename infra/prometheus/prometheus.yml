global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flow-control
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081
  - job_name: mock-target-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - mock-target-a:9101
          - mock-target-b:9102
          - mock-target-c:9103
