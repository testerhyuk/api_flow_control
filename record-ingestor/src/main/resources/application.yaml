spring:
  application:
    name: record-ingestor
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8095

record-ingestor:
  topic-prefix: flow-control.requests.
  auto-start: true
  seed: 42
  targets:
    target-a:
      rate: 100
    target-b:
      rate: 50
    target-c:
      rate: 20
